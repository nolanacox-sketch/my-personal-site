  <!-- Google Fonts: Fraunces (headings) + Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="/css/style.css" />

  <script>
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }
    if (window.location.hash) {
      history.replaceState(null, '', window.location.pathname + window.location.search);
    }
    window.scrollTo(0, 0);
  </script>

  </header>

      <div class="section-inner fade-in-up">

        <div class="contact-links">
          <a href="mailto:nolan.a.cox@gmail.com" class="btn btn-outline">nolan.a.cox@gmail.com</a>
        </div>
        <div class="social-links">
          <a href="https://www.linkedin.com/in/nolanacox/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
