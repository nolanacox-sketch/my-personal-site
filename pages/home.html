<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nolan Cox — Personal Site</title>
  <meta name="description" content="Personal website of Nolan Cox" />

  <!-- Google Fonts: Fraunces (headings) + Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="/css/style.css" />

  <script>
    // Always open the page at the top, even if the browser tries to
    // restore a previous scroll position or the URL has a leftover #hash.
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }
    if (window.location.hash) {
      history.replaceState(null, '', window.location.pathname + window.location.search);
    }
    window.scrollTo(0, 0);
  </script>
</head>
<body>

  <!-- ===== Nav Bar ===== -->
  <header class="navbar">
    <div class="navbar-inner">
      <a href="/" class="navbar-logo">Nolan Cox</a>
      <nav class="navbar-links">
        <a href="/about">About</a>
        <a href="/background">Background</a>
        <a href="/resume">Resume</a>
        <a href="/photos">Photos</a>
        <a href="/contact">Contact</a>
      </nav>
    </div>
  </header>

  <main>

    <!-- ===== Hero ===== -->
    <section class="hero">
      <div class="hero-content fade-in-up">
        <img src="/images/photo1.jpg" alt="Nolan Cox" class="hero-photo" />
        <h1 class="hero-name gradient-text">Nolan Cox</h1>
        <p class="hero-tagline">Forging a path to success by leading sales teams with humility, integrity, and grit.</p>
        <nav class="hero-links" aria-label="Site sections">
          <a href="/about" class="btn btn-outline">About</a>
          <a href="/background" class="btn btn-outline">Background</a>
          <a href="/resume" class="btn btn-outline">Resume</a>
          <a href="/photos" class="btn btn-outline">Photos</a>
          <a href="/contact" class="btn btn-outline">Contact</a>
        </nav>
      </div>
    </section>

  </main>

  <!-- ===== Footer ===== -->
  <footer class="footer">
    <p>&copy; <span id="year"></span> Nolan Cox. Built with Node.js &amp; Express.</p>
  </footer>

  <script src="/js/main.js"></script>
</body>
</html>
